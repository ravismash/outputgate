# Build and test every module on each push and pull request. Fully offline:
# the one live-Ollama test only runs when OUTPUTGATE_LIVE_OLLAMA=1, which CI never sets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      - name: Upload golden-run HTML reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: golden-reports
          path: '**/build/outputgate/*.html'
          if-no-files-found: ignore
          retention-days: 14

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            pydantic: 'pydantic==2.1.0'
          - python-version: '3.13'
            pydantic: 'pydantic>=2.1'
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -r requirements-dev.txt "${{ matrix.pydantic }}"

      - name: Test
        run: pytest -q
