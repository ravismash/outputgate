[project]
name = "outputgate-evals"
version = "0.1.0"
description = "Inspect evals from the Outputgate benchmark: SEC balance-sheet extraction scored against XBRL"
readme = "evals/README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "inspect_ai>=0.3.100",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points.inspect_ai]
outputgate_evals = "sec_balance_sheets"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals/sec_balance_sheets"]

[tool.pytest.ini_options]
testpaths = ["evals/tests"]
